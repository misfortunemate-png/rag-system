# Web照合 三層格付けリスト
# 更新日: 2026-08-16
# 格納先: rag-system/data/web_tiers.yaml
#
# ─── タグ定義 ───────────────────────────────────────────
# LLMが検索で取得したURLを応答に引用する際は、タグを必ず併記すること。
# 例: 「能美防災公式（【tier-2：仕様書】）によれば…」
#
# 【tier-1：法令原文】
#   法令・告示の条文テキストを直接取得できるエンドポイント。根拠として引用可。
#
# 【tier-2：仕様書】
#   メーカー発行の仕様書・施工説明書・カタログスペック。
#   正式名称・規格・寸法・型番が記載されているもの。
#   特定製品の仕様値を根拠として引用可。
#
# 【tier-3：独自知見】
#   法規に依存しない設計・施工判断の独自知見を持つ専門家コンテンツ。
#   「なぜその手法か・何が起きるか・どう選ぶか」まで踏み込んでいること。
#   専門家の見解として引用可。
#
# 【tier-3-2：引用列挙のみ】
#   規程の条文・箇条書きを転記・整理しているだけ。
#   専門家にとって新たな判断材料を提供しない。
#   引用禁止。
#
# 【tier-3-4：過度の一般化リスクあり】
#   専門用語の平易な言い換えや規程に基づく推論を行うが、
#   断言できない事項を断言する傾向があり信頼度が限定的。
#   「〇〇では△△と述べているが確認を要する（【tier-3-4：過度の一般化リスクあり】）」
#   のように明示した上で補助的に参照するにとどめる。
# ────────────────────────────────────────────────────────

tier_1:
  # 条件: エンドポイントから法令・告示の条文テキストを直接取得できること
  # 認証不要。短時間大量アクセスおよび全法令ループ取得は禁止。

  - tag: "【tier-1：法令原文】"
    endpoint: "https://laws.e-gov.go.jp/api/1/lawdata/{法令ID}"
    description: >
      e-Gov法令API v1。現行法令の全文XMLを無認証で取得可。
      主要法令（IDは law_list_endpoint で確認）:
        建築基準法         325AC0000000201
        建築基準法施行令   325CO0000000338
        消防法             323AC1000000186
        電気事業法         339AC0000000170
        労働安全衛生法     347AC0000000057
        省エネ法           347AC0000000049
        水道法             332AC0000000177
        下水道法           333AC0000000079
    law_list_endpoint: "https://laws.e-gov.go.jp/api/1/lawlists/1"
    output_format: "XML（条・項・号単位で構造化済み）"
    auth: "不要"
    rate_limit: "あり。1件ずつインターバルを設けること"
    verified: true

  - tag: "【tier-1：法令原文】"
    endpoint: "https://laws.e-gov.go.jp/api/2/"
    description: >
      e-Gov法令API v2（2025-03リリース）。
      キーワード検索・改正履歴取得・JSON形式出力（試行版）に対応。
      仕様書: https://laws.e-gov.go.jp/api/2/swagger-ui
    output_format: "XML / JSON（試行版）"
    auth: "不要"
    verified: true

tier_2:
  # 条件:
  #   - 仕様書・施工説明書・カタログスペックのPDFまたはHTMLを直接取得できること
  #   - 正式名称・規格（JIS等）・寸法・型番を含むこと
  #   - モノタロウ等の集約販売サイトは不可
  # B材（鋼管・電線等）は代表メーカー1件のみ登録
  # 高額・仕様差異大（TOTO/LIXILのトイレ等）は複数登録可

  # ── 鋼管（電線管・配管用）─ 丸一鋼管 ──
  - tag: "【tier-2：仕様書】"
    url: "https://www.maruichikokan.co.jp/products/349/"
    category: "鋼製電線管"
    content: >
      鋼製電線管（G管・C管・E管）の規格・寸法表。
      JIS C 8305準拠。厚鋼電線管（G16〜G104）・薄鋼電線管（C19〜C75）・
      ねじなし電線管（E19〜E75）の外径・外径許容差・近似厚さ・長さ・重量をHTML表で掲載。
      個別仕様書PDFおよびカタログPDFへの直リンクあり。
    login_required: false
    note: "G/C/E管の寸法表をHTML上で直接確認可。ポリエチレンライニング鋼管（PE管）はhttps://www.maruichikokan.co.jp/products/353/"
    verified: true

  - tag: "【tier-2：仕様書】"
    url: "https://www.maruichikokan.co.jp/products/343/"
    category: "配管用炭素鋼鋼管 SGP"
    content: >
      配管用炭素鋼鋼管（SGP）の機械的性質・伸び規定。
      JIS G 3452準拠。管種記号SGP、引張強さ290N/mm2以上、製造寸法6A〜500A。
      ただし外径・肉厚の寸法表はHTML上に掲載なし（カタログPDFに収録）。
    login_required: false
    note: "機械的性質のみHTML確認可。外径・肉厚寸法はカタログPDF（https://www.maruichikokan.co.jp/wp/wp-content/uploads/2025/01/product-04.pdf）を参照"
    verified: true

  # ── 石膏ボード ─ 吉野石膏 ──
  - tag: "【tier-2：仕様書】"
    url: "https://yoshino-gypsum.com/tpc/list_spec"
    category: "石膏ボード"
    content: >
      吉野石膏 全製品の規格区分・寸法一覧。JIS A 6901準拠。
      GB-R（タイガーボード）、GB-F（強化）、GB-S（シージング）、GB-D（化粧）、
      GB-R-H（普通硬質）、GB-St（構造用）、GB-NC（不燃積層）、GB-L（ラスボード）等、
      各製品の厚さ（7/9.5/12.5/15/21/25mm）と版サイズ（3×6/3×8/3×9/メートル版等）をHTML表で掲載。
      準不燃・不燃認定番号（QM-9828、NM-8619等）も記載。
    login_required: false
    verified: true

  # ── 電線・ケーブル ─ フジクラ・ダイヤケーブル ──
  - tag: "【tier-2：仕様書】"
    url: "https://www.fujikura-dia.co.jp/products/specification.php"
    category: "電力ケーブル・制御ケーブル"
    content: >
      フジクラ・ダイヤケーブル 全品種の仕様書PDFリスト。
      電力系: IV・HIV・600V CV・CVD・CVT・CVQ・CVS・3300V CV/CVT・6600V CV/CVT・
               6600V CV(EE)/CVT(EE)・EM系（CE/F・CET/F等）・NH-FP（耐火）・EM-FP
      制御計装用: CVV・CVV-S・FCPEV
      防災: HP-F・AEV-F
      各品番に仕様書番号（SES-XXXXX）と直接PDFリンクが付与されている。
    login_required: false
    note: "PDFは直接URLアクセス可。例: https://www.fujikura-dia.co.jp/pdf/specification/SES-00043.pdf（600V CV）"
    verified: true

  # ── 感知器 ─ 能美防災 ──
  - tag: "【tier-2：仕様書】"
    url: "https://www.nohmi.co.jp/shoninzu/shoninzu_index.html"
    category: "自動火災報知設備 感知器（機器図面インデックス）"
    content: >
      能美防災 自動火災報知設備 機器図面データのカテゴリ一覧。
      熱感知器（差動式スポット型・定温式・熱アナログ式）、
      煙感知器（光電式スポット型・イオン化式等）、
      炎感知器、ガス漏れ感知器、受信機・制御盤等を収録。
      各ページから型番別に仕様（種別・設置方式）と外観図PDFへの直リンクが取得可。
    login_required: false
    note: "個別型番ページ例: 差動式スポット型一般型 https://www.nohmi.co.jp/shoninzu/006/006-0003.html"
    verified: true

  - tag: "【tier-2：仕様書】"
    url: "https://www.nohmi.co.jp/shoninzu/006/006-0003.html"
    category: "差動式スポット型感知器（一般型）"
    content: >
      能美防災 差動式スポット型感知器（一般型）の機器図面一覧。
      型番: FDPJ106-R/U（1種）、FDPJ206-R/U（2種）、FDPJ226N-DW（防水型）等。
      各型番の仕様（種・露出/埋込・オプション）と外観図PDFへの直リンクあり。
    login_required: false
    verified: true

  - tag: "【tier-2：仕様書】"
    url: "https://www.nohmi.co.jp/shoninzu/007/007-0001.html"
    category: "光電式スポット型感知器"
    content: >
      能美防災 光電式スポット型感知器の機器図面一覧。
      型番: FDKJ156N（1種）、FDKJ256N（2種）、各露出/埋込型。
      各型番の仕様と外観図PDFへの直リンクあり。
    login_required: false
    verified: true

  # ── 衛生器具（大便器）─ TOTO ──
  - tag: "【tier-2：仕様書】"
    url: "https://www.com-et.com/jp/page/toilet/"
    category: "大便器 TOTO（商品情報インデックス）"
    content: >
      TOTO COM-ET トイレゾーンの全製品インデックス。
      腰掛便器（ネオレストNX/LS/AS/RS・GGA・ピュアレストEX/QR等）、
      パブリック向け便器（フラッシュタンク式・フラッシュバルブ式・壁掛式）、
      小便器、便座（アプリコット・SS等）のCAD・カタログ・商品図・施工説明書へのリンクを一覧表示。
