  # ── tier-3-2: 引用列挙のみ ──

  - tag: "【tier-3-2：引用列挙のみ】"
    url: "https://kenshoku-bank.com/column/1596/"
    judgment: >
      建設業求人サイトの集客コラム。「分電盤とは」から始まり3部位を羅列して終わる。
      φ（ファイ）を「パイ」と読ませるなど書き手が電気の専門家でないことが明白。
      記述は全般的に不正確。専門家にとって情報価値ゼロ。

  - tag: "【tier-3-2：引用列挙のみ】"
    url: "https://www.yonashin-home.net/blog/electric-facilities-material/jyutakubundenban/naisenkitei/"
    judgment: >
      電設資材通販サイトのブログ。内線規程1365-1の条文を抜粋・列挙し
      「トイレはNG・押入はNG」をQ&A化しただけ。設計判断を含まない。
      記事末尾に分電盤販売ページへのリンクがあり集客目的が主。

  # ── tier-3-4: 過度の一般化リスクあり ──

  - tag: "【tier-3-4：過度の一般化リスクあり】"
    url: "https://www2.panasonic.biz/jp/basics/electric/breakers/residential-panelboard-about/"
    judgment: >
      パナソニックによる一般消費者向けの概説コンテンツ。
      電力供給系統の流れを図解で正確に説明するが、設計判断を含む情報はない。
      LLMが既に持つ一般知識の範囲内。専門家向けではなく判断材料にならない。

  - tag: "【tier-3-4：過度の一般化リスクあり】"
    url: "https://progress-company.jp/blog/20260318/"
    judgment: >
      電気工事会社の採用誘導ブログ。分電盤の構成・費用相場・業者選びを幅広く扱うが、
      「分電盤の寿命は13年」（根拠・条件の説明なし）など断言できない事項を断言する。
      部分的に正確な情報を含むが一般化リスクがあり、引用には裏付けを要する。

