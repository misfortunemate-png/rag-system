      パナソニック 照明器具の施工説明書・仕様図・BIMデータ。
      品番・キーワード検索でPDF直接ダウンロード可。
      器具スペック・配光データ・取付寸法・重量を収録。
    login_required: false
    verified: true

  - tag: "【tier-2：仕様書】"
    url: "https://www2.panasonic.biz/scvb/a2A/zumenMainList.G01?system_id=scva&category_cd=CTGD90009"
    category: "電設資材・空調・住宅設備の統合図面検索"
    content: >
      パナソニック 電設資材・照明・空調・住宅設備の仕様図・施工説明書を品番で統合検索。
      分電盤・配線器具・幹線機器・空調機の外形図・施工図・接続図・仕様一覧を収録。
    login_required: false
    note: "検索UIはJS依存。品番確定時はPDF URLを直接構築して取得可"
    verified: true

  # ── 未検証（次回調査予定） ──
  # 塩ビ管（VP/VU）: 積水化学 eslontimes.com はPDFのみ・ログイン不要か不明
  #   候補: https://www.eslontimes.com/product/build/250/
  # ダイキン業務用エアコン: 技術資料ページ未特定
  # 東芝ライテック: 施工説明書DLページ未特定
  # ホーチキ: 技術資料DLページ未特定

tier_3:
  # 条件（すべて満たすこと）:
  #   1. 特定の法令・規範に依存しない設計・施工の判断知見を含む
  #   2. HTMLまたはPDFとして本文テキストを直接取得可能（認証不要）
  #   3. 匿名可。文章全体に権威と独自性が認められること
  #   4. ドメインではなく個別URLで登録
  #   5. 「読んだ後に設計判断が変わるか」を採否の最終基準とする

  # ── 電気設備設計（electric-facilities.jp）──
  # 2009〜継続更新。電気設備設計者による個人運営。
  # 「なぜその手法か・何が起きるか・どう選ぶか」まで踏み込む。
  # 認証不要・全文HTML取得可。

  - tag: "【tier-3：独自知見】"
    url: "https://electric-facilities.jp/denki4/"
    content: >
      電気設備設計の基礎知識カテゴリ。幹線設計・ケーブル選定・配線器具計画・
      電線管の使い分け・電圧降下計算・接地設計・分電盤設計。
      配下の個別記事（例: /denki4/haikan.html）が本体。
    access: "認証不要・全文HTML取得可"

  - tag: "【tier-3：独自知見】"
    url: "https://electric-facilities.jp/denki4/haikan.html"
    content: >
      電線管の種類と規格。占積率の設計原則・電流減少係数・
      金属管の磁気的不平衡による発熱メカニズム・コンクリート打込み時の被り厚さ干渉・
      CD管の法的解釈（電線管工事 vs 保護管路）・FEP管の選定境界（呼径28mm超）・
      支持間隔・接地要件・CV-1C多条敷設時の合成樹脂管選定の根拠。
    access: "認証不要・全文HTML取得可"

  - tag: "【tier-3：独自知見】"
    url: "https://electric-facilities.jp/denki8/"
    content: "受変電設備設計・保護装置選定・保護リレーの種類と整定方法"
    access: "認証不要・全文HTML取得可"

  - tag: "【tier-3：独自知見】"
    url: "https://electric-facilities.jp/denki9/"
    content: "非常用照明・誘導灯・自動火災報知設備・非常用発電機・防災蓄電池の設計"
    access: "認証不要・全文HTML取得可"

  - tag: "【tier-3：独自知見】"
    url: "https://electric-facilities.jp/denki5/"
    content: "電話・LAN・テレビ共聴・構内通信・電気時計・避雷設備の設計"
    access: "認証不要・全文HTML取得可"

  - tag: "【tier-3：独自知見】"
    url: "https://electric-facilities.jp/denki6/"
    content: "電力ケーブル・通信ケーブル・光ファイバーの特徴・選定根拠・用途別比較"
    access: "認証不要・全文HTML取得可"

  - tag: "【tier-3：独自知見】"
    url: "https://electric-facilities.jp/denki7/"
    content: "電気設備用語辞典。機器・材料・技術・指標・単位を使用場面と選定根拠を含めて解説"
    access: "認証不要・全文HTML取得可"

  # ── 電気技術解説（日本電気技術者協会 JEEA）──
  # 公益社団法人JEEAによる解説。電技省令・解釈の条文を実務視点で再構成。

  - tag: "【tier-3：独自知見】"
    url: "https://jeea.or.jp/course/"
    content: >
      JEEA音声付き電気技術解説講座インデックス。
      電気数学・理論・法規・電気安全・需要設備・送配電等の体系的技術解説。
      配下の個別講座（/course/contents/NNNNN/）が本体。
    access: "認証不要・全文HTML取得可"

  - tag: "【tier-3：独自知見】"
    url: "https://jeea.or.jp/course/contents/11107/"
    content: >
      低圧屋内配線の工事方法。がいし引き工事・金属管工事・ケーブル工事の施設要件・
      最小導体径の根拠・弱電流電線との離隔距離・
      メタルラス造営材貫通時の処置と漏電経路の説明。
      電技省令第57条・第62条・解釈第144条・第157〜167条を根拠として明示。
    access: "認証不要・全文HTML取得可"

  # ── 建築設備計算（建築設備ラボ: kenchikusetubisekkei.com）──
