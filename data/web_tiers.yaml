    login_required: false
    note: >
      COM-ET自体はログイン不要でアクセス可。
      ただし個別の商品図・施工説明書PDFのダウンロードはログイン要否が未確認。
      会員登録は無料。
    verified: true

  # ── 衛生器具（大便器）─ LIXIL ──
  - tag: "【tier-2：仕様書】"
    url: "https://iinavi.inax.lixil.co.jp/products/toiletroom/"
    category: "大便器 LIXIL INAX（商品情報）"
    content: >
      LIXIL INAXビジネスユーザー向けサイト「いいナビ」のトイレゾーン。
      品番から取扱説明書・施工説明書・取替用部品資料を検索可。
      SATIS・DT系・組み合わせ便器等の寸法図・施工仕様を収録。
    login_required: false
    note: >
      【重要】robots.txtによりボット/スクリプトからの自動アクセスが禁止されている。
      機械的フェッチ不可。手動でのデータ確認のみ可。
      TOTOと仕様が大きく異なるため（排水方式・洗浄方式・取付寸法）両社掲載が有効。
    verified: false
    access_restriction: "robots.txt disallowed"

  # ── 電設資材・照明 ─ パナソニック ──
  - tag: "【tier-2：仕様書】"
    url: "https://www2.panasonic.biz/ls/sumai/manual/"
    category: "住宅設備・建材の施工説明書"
