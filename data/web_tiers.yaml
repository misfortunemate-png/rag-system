      パナソニック 住宅設備・建材の商品仕様図・取扱説明書・施工説明書。
      対象: キッチン・バスルーム・洗面・トイレ・内装収納・外まわり・給湯機器。
      品番または品名から検索しPDF直接ダウンロード可。
    login_required: false
    note: "検索UIはJS依存。VAソリューションカタログの一部機能は会員登録が必要"
    verified: true

  - tag: "【tier-2：仕様書】"
    url: "https://www2.panasonic.biz/jp/catalog/lighting/products/"
    category: "照明器具の施工説明書"
