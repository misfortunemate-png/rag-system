  # 給水・給湯・排水・空調・換気・排煙の計算手順と設計判断を体系的に解説。
  # electric-facilities.jpより文章深度はやや浅いが、
  # 計算根拠の提示と配管計画のOK/NG判断を含む点でtier-3基準を満たす。

  - tag: "【tier-3：独自知見】"
