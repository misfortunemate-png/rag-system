    content: >
      建築設備計算記事インデックス。
      給水量算定・給水管径・給湯・排水管径・通気管・空調熱負荷・
      加湿量・換気風量・ダクトサイズ・静圧計算・排煙・結露・騒音の計算手順一覧。
      配下の個別記事が本体。
    access: "認証不要・全文HTML取得可"

  - tag: "【tier-3：独自知見】"
    url: "https://kenchikusetubisekkei.com/56-ventpipeplan/"
    content: >
      通気管の配管計画。排水横管からの通気管取り出し角度（頂部から45°以内の根拠）・
      横枝管の接続高さ（最高位器具あふれ縁より150mm以上の根拠）・
      通気弁（ドルゴ）の採用条件と排水槽への適用禁止理由（正圧緩和機構がないため）・
      通気口の離隔基準。
    access: "認証不要・全文HTML取得可"

  - tag: "【tier-3：独自知見】"
    url: "https://kenchikusetubisekkei.com/18-water-calculation/"
    content: >
      管均等表による横枝管給水管径の算定手順。
      器具の給水負荷単位換算・同時使用率・口径決定の手順。
